<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Dual Pulse">
  <!-- Dual Pulse: los dos anillos del visualizador, con el punto de pulso de
       cada capa desfasado. Misma geometria que el icono .ico del instalador:
       A (#ff6b4a) exterior con su "1" a las 12, B (#4ad9ff) interior ya corrido. -->
  <rect width="256" height="256" rx="56" fill="#15171c"/>

  <!-- Anillo A: hueco de 46 grados centrado arriba -->
  <path d="M 161.50 49.06 A 85.76 85.76 0 1 1 94.50 49.06"
        fill="none" stroke="#ff6b4a" stroke-width="18.43"/>
  <!-- Anillo B: hueco de 46 grados centrado abajo -->
  <path d="M 108.99 172.77 A 48.64 48.64 0 1 1 147.01 172.77"
        fill="none" stroke="#4ad9ff" stroke-width="18.43"/>

  <!-- Puntos de pulso: A en el "1", B desfasado -->
  <circle cx="128" cy="42.24" r="16.95" fill="#ff6b4a"/>
  <circle cx="128" cy="42.24" r="5.76" fill="#fff"/>
  <circle cx="165.26" cy="159.27" r="16.95" fill="#4ad9ff"/>
  <circle cx="165.26" cy="159.27" r="5.76" fill="#fff"/>
</svg>
